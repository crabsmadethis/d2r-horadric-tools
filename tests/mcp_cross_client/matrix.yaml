# Cross-client d2r MCP test matrix (public-repo variant).
#
# Purpose: Verify the d2r-tools MCP server returns identical tool output
# regardless of which MCP client (Claude Code vs Codex) consumes it. Each
# row is called by both clients; results are diffed by diff.py.
#
# This public-repo matrix is the lookup-only subset — it runs without
# any extracted game-data fixtures (Steam saves, vanilla/, build/) beyond
# what `python3 -m d2r_mod extract` produces. The upstream d2r-editor
# repo maintains an expanded 17-row variant that also exercises save_*,
# mod_diff, mod_audit, mod_build.
#
# Parity semantics:
#   must_contain — every substring listed MUST appear somewhere in the
#                  tool's serialized text response. Order-insensitive.

rows:
  - id: 1
    tool: d2r_search
    args: {query: harlequin}
    expect:
      must_contain:
        - '"id": 248'
        - '"name": "Harlequin Crest"'
        - '"type": "unique"'
        - '"count": 1'

  - id: 2
    tool: d2r_lookup_unique
    args: {query: harlequin}
    expect:
      must_contain:
        - '"uid": 248'
        - '"code": "uap"'
        - '"qlvl": 69'
        - '"base_name": "Shako"'
        - '"stat": "item_allskills"'

  - id: 3
    tool: d2r_lookup_unique
    args: {query: 248}
    expect:
      # Regression row for the `query: str | int` schema fix. A strict MCP
      # client (Codex) sends integer args as integer; pydantic used to
      # reject with "Input should be a valid string". Claude historically
      # coerced silently so the bug was invisible there.
      must_contain:
        - '"uid": 248'
        - '"name": "Harlequin Crest"'

  - id: 4
    tool: d2r_lookup_runeword
    args: {query: enigma}
    expect:
      must_contain:
        - '"rw_id": 32'
        - '"name": "Enigma"'
        - '"Jah"'
        - '"Ith"'
        - '"Ber"'
        - '"sockets": 3'

  - id: 5
    tool: d2r_lookup_set_item
    args: {query: tal rasha}
    expect:
      must_contain:
        - '"set_id": 76'
        - '"Tal Rasha''s Fire-Spun Cloth"'
        - '"Tal Rasha''s Adjudication"'
        - '"set_id": 78'

  - id: 6
    tool: d2r_lookup_item_base
    args: {query: hax}
    expect:
      must_contain:
        - '"code": "hax"'
        - '"name": "Hand Axe"'
        - '"width": 1'
        - '"height": 3'
        - '"max_sockets": 2'

  - id: 7
    tool: d2r_lookup_skill
    args: {query: blizzard}
    expect:
      must_contain:
        - '"skill_id": 59'
        - '"name": "Blizzard"'
        - '"char_class": "sor"'

  - id: 8
    tool: d2r_lookup_stat
    args: {query: fcr}
    expect:
      must_contain:
        - '"stat_id": 105'
        - '"name": "item_fastercastrate"'
        - '"save_bits": 7'
        - '"save_add": 20'
        - '"fcr"'

  - id: 9
    tool: d2r_chargen_list
    args: {}
    expect:
      # The public repo ships `chars/ExamplePaladin.yaml` only. Users who
      # add their own characters should see them listed here.
      must_contain:
        - '"status": "ok"'
        - '"ExamplePaladin"'
        - '"chars_dir"'
