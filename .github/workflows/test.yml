name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Public hygiene
        run: python tools/public_hygiene_check.py

      # Tier 1: no extracted D2R game data, no .d2s fixtures.
      # The --ignore'd modules require either generated data modules
      # (d2r_chargen/data/*.py from `d2r-mod extract`) or .d2s fixtures that
      # aren't checked in. Run them locally with the matching marker
      # (smoke / slow / integration / e2e) — see CONTRIBUTING.md.
      - name: Run tests (Tier 1 — no game data required)
        shell: bash
        run: |
          pytest tests/ -v --timeout=60 \
            -m "not integration and not slow and not e2e and not smoke" \
            --ignore=tests/fixtures/ \
            --ignore=tests/test_chargen.py \
            --ignore=tests/test_decoder.py \
            --ignore=tests/test_fixtures.py \
            --ignore=tests/test_importer.py
