name: Publish to PyPI

# Triggered when a GitHub Release is published. The release tag (e.g. v1.0.0)
# must match the version in pyproject.toml.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secrets required.
# One-time setup on PyPI:
#   1. Create the project on PyPI (or do it via the first manual upload).
#   2. Project settings -> Publishing -> Add a trusted publisher:
#        Owner:    crabsmadethis
#        Repo:     d2r-horadric-tools
#        Workflow: publish.yml
#        Env:      pypi
#   3. Repo settings -> Environments -> create "pypi" (no secrets needed).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version matches release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
